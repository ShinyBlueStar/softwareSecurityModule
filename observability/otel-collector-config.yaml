receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

exporters:
  debug:
    verbosity: basic
  elasticsearch/traces:
    endpoints: ["http://elasticsearch:9200"]
    logs_index: ssm-traces
    traces_index: ssm-traces
  elasticsearch/logs:
    endpoints: ["http://elasticsearch:9200"]
    logs_index: ssm-logs
  elasticsearch/metrics:
    endpoints: ["http://elasticsearch:9200"]
    metrics_index: ssm-metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [elasticsearch/traces, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [elasticsearch/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [elasticsearch/metrics, debug]
