server:
  port: 8009
  ssl:
    enabled: true
    key-store: classpath:keystore.jks
    key-store-type: JKS
    key-store-password: ${SSM_KEYSTORE_PASSWORD:changeit}
    key-password: ${SSM_KEY_PASSWORD:changeit}

spring:
  application:
    name: ssm-service
  datasource:
    url: ${SSM_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/ssm00srv}
    username: ${SSM_DATASOURCE_USERNAME:ssm}
    password: ${SSM_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true
          revision_field_name: rev
          revision_type_field_name: revtype
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: false
    clean-disabled: false
    clean-on-validation-error: true
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 1
    schemas: SSM
    locations: classpath:db/migration
    out-of-order: false
    group: true
  data:
    redis:
      host: ${SSM_REDIS_HOST:localhost}
      port: ${SSM_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 20s
redisson:
  singleServerConfig:
    address: "redis://${SSM_REDIS_HOST:localhost}:${SSM_REDIS_PORT:6379}"
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8003/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
    info:
      enabled: true
  info:
    app:
      name: Ssm Service
      version: 1.0.0
      description: This is ssm service API
file:
  storage:
    path: uploads/
vault:
  timeout-seconds: 5
  base:
    url: ${VAULT_BASE_URL:http://localhost:8014}

ssm:
  rate-limit:
    view-secret:
      max-requests: 3
      window-seconds: 300
    generate:
      pin:
        max-requests: 3
      otp-cvv:
        max-requests: 5
      window-seconds: 300
  otp:
    retry-limit: 3
    ttl-minutes: 2
  retry:
    max-attempts: 3
    window-minutes: 15
  lock:
    default-duration-minutes: 30

logging:
  level:
    root: INFO
    com.sample.system: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.jdbc.connections: DEBUG
    org.springframework.jdbc.core: DEBUG
    com.zaxxer.hikari: DEBUG

springdoc:
   swagger-ui:
     path: /swagger-ui.html
     config-url: /v3/api-docs/swagger-config
     url: /v3/api-docs
     operationsSorter: method
     tagsSorter: alpha
   api-docs:
     path: /v3/api-docs