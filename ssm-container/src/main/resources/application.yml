server:
  port: 8009
  shutdown: graceful
  ssl:
    enabled: true
    key-store: classpath:keystore.jks
    key-store-type: JKS
    key-store-password: ${SSM_KEYSTORE_PASSWORD:changeit}
    key-password: ${SSM_KEY_PASSWORD:changeit}

spring:
  application:
    name: ssm-service
  datasource:
    url: ${SSM_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/ssm00srv}
    username: ${SSM_DATASOURCE_USERNAME:ssm}
    password: ${SSM_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true
          revision_field_name: rev
          revision_type_field_name: revtype
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: false
    baseline-on-migrate: false
    baseline-version: 1
    schemas: SSM
    locations: classpath:db/migration
    out-of-order: false
    group: true
  data:
    redis:
      host: ${SSM_REDIS_HOST:localhost}
      port: ${SSM_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 20s
redisson:
  singleServerConfig:
    address: "redis://${SSM_REDIS_HOST:localhost}:${SSM_REDIS_PORT:6379}"
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8003/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    info:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    app:
      name: Ssm Service
      version: 1.0.0
      description: This is ssm service API
  tracing:
    sampling:
      probability: ${SSM_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 30s
  opentelemetry:
    resource-attributes:
      service.name: ssm-service
      service.namespace: bmicc
file:
  storage:
    path: uploads/
vault:
  timeout-seconds: 5
  base:
    url: ${VAULT_BASE_URL:http://localhost:8014}

resilience4j:
  circuitbreaker:
    instances:
      vaultService:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      vaultService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.sample.system.ssm.service.thirdparty.ThirdPartyException

ssm:
  rate-limit:
    view-secret:
      max-requests: 3
      window-seconds: 300
    generate:
      pin:
        max-requests: 3
      otp-cvv:
        max-requests: 5
      window-seconds: 300
  otp:
    retry-limit: 3
    ttl-minutes: 2
  retry:
    max-attempts: 3
    window-minutes: 15
  lock:
    default-duration-minutes: 30
logging:
  level:
    root: INFO
    com.sample.system: INFO
springdoc:
   swagger-ui:
     path: /swagger-ui.html
     config-url: /v3/api-docs/swagger-config
     url: /v3/api-docs
     operationsSorter: method
     tagsSorter: alpha
   api-docs:
     path: /v3/api-docs