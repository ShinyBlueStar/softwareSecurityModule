# =====================================================
# SSM Service - Prod Alias
# =====================================================

# Prefer requesting profile "production":
# http://localhost:8888/ssm-service/production

# Application
server.port=8009
spring.application.name=ssm-service

# SSL
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-type=JKS
server.ssl.key-store-password=${SSM_KEYSTORE_PASSWORD:changeit}
server.ssl.key-password=${SSM_KEY_PASSWORD:changeit}

# Datasource
spring.datasource.url=${SSM_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/ssmsrv}
spring.datasource.username=${SSM_DATASOURCE_USERNAME:ssm}
spring.datasource.password=${SSM_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate Envers
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=SSM
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.group=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka-server-svc.dragon.svc.cluster.local/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.info.enabled=true
management.info.app.name=Ssm Service
management.info.app.version=1.0.0
management.info.app.description=This is ssm service API

# File Storage
file.storage.path=${SSM_FILE_STORAGE_PATH:uploads/}

# Vault
vault.timeout-seconds=5
vault.base.url=${VAULT_BASE_URL:}

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Redis / Redisson
spring.data.redis.host=${SSM_REDIS_HOST:redis-svc.redis.svc.cluster.local}
spring.data.redis.port=${SSM_REDIS_PORT:6379}
spring.data.redis.password=${SSM_REDIS_PASSWORD:}
redisson.singleServerConfig.address=redis://${SSM_REDIS_HOST:redis-svc.redis.svc.cluster.local}:${SSM_REDIS_PORT:6379}
redisson.singleServerConfig.password=${SSM_REDIS_PASSWORD:}
