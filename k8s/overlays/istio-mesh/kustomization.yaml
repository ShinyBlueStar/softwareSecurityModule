# Use this overlay on clusters that have Istio installed and where the
# vault/security-service is also mesh-enrolled. On any other cluster, apply
# k8s/base directly instead — it has no Istio dependency.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/istio-mtls
